name: Telegram Bot

on:
  schedule:
    - cron: '0 */5 * * *'  # restart every 5 hours
  workflow_dispatch:        # manual trigger from GitHub UI

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 330    # 5.5 hours, exits before GitHub's 6h limit

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run bot
        working-directory: backend
        run: node src/bot-standalone.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GOOGLE_AI_KEY: ${{ secrets.GOOGLE_AI_KEY }}
          TELEGRAM_PROXY_URL: ${{ secrets.TELEGRAM_PROXY_URL }}
