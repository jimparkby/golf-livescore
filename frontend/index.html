    <meta property="og:title" content="GolfMinsk Live — скоринг, турниры и статистика" />
    <meta property="og:description" content="Live-скоринг для Golf Club Minsk: ведите счёт раундов, следите за турнирами 2026 и статистикой." />

    <!-- PWA: открывается без браузера при добавлении на экран «Домой» -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GolfMinsk" />

  </head>

  <body>
    <div id="root"></div>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      // Apply Telegram safe area CSS variables before React mounts so toasts
      // never overlap Telegram's close button / status bar chrome.
      (function () {
        var tg = window.Telegram && window.Telegram.WebApp;
        if (!tg) return;
        function apply() {
          var d = tg.safeAreaInset, c = tg.contentSafeAreaInset;
          var dTop = (d && d.top) || 0, cTop = (c && c.top) || 0;
          var isFs = tg.isFullscreen || false;
          var top = cTop > 0 ? cTop : (isFs ? Math.max(dTop, 52) : dTop);
          document.documentElement.style.setProperty('--tg-safe-top', top + 'px');
          document.documentElement.style.setProperty('--tg-safe-bottom', ((d && d.bottom) || 0) + 'px');
        }
        // Signal readiness and request fullscreen as early as possible so that
        // safe area values are populated before React's useTelegram hook runs.
        try { tg.ready(); } catch (e) {}
        try { if (typeof tg.requestFullscreen === 'function') tg.requestFullscreen(); } catch (e) {}
        apply();
        tg.onEvent && tg.onEvent('fullscreenChanged',       apply);
        tg.onEvent && tg.onEvent('safeAreaChanged',         apply);
        tg.onEvent && tg.onEvent('contentSafeAreaChanged',  apply);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
